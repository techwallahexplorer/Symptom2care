<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test - Debug Mode</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e293b;
            color: #f1f5f9;
        }
        .test-section {
            background: #334155;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0891b2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0e7490; }
        #log {
            background: #1e293b;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #475569;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #64748b;
            padding-left: 10px;
        }
        input {
            padding: 10px;
            margin: 5px 0;
            width: 300px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f1f5f9;
        }
    </style>
</head>
<body>
    <h1>🔧 Authentication Debug Test</h1>
    
    <div class="test-section">
        <h2>Test Credentials</h2>
        <p><strong>Email:</strong> urjagjeetsingh@gmail.com</p>
        <p><strong>Password:</strong> H1a2r3t9@</p>
    </div>

    <div class="test-section">
        <h2>Step 1: Firebase Initialization Test</h2>
        <button onclick="testFirebaseInit()">Test Firebase Init</button>
        <div id="firebaseStatus"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: DOM Elements Test</h2>
        <button onclick="testDOMElements()">Test DOM Elements</button>
        <div id="domStatus"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Test Signup</h2>
        <input type="text" id="testName" placeholder="Full Name" value="Test User"><br>
        <input type="email" id="testEmail" placeholder="Email" value="urjagjeetsingh@gmail.com"><br>
        <input type="password" id="testPassword" placeholder="Password" value="H1a2r3t9@"><br>
        <input type="password" id="testConfirmPassword" placeholder="Confirm Password" value="H1a2r3t9@"><br>
        <button onclick="testSignup()">Test Signup</button>
        <div id="signupStatus"></div>
    </div>

    <div class="test-section">
        <h2>Step 4: Test Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" value="urjagjeetsingh@gmail.com"><br>
        <input type="password" id="loginPassword" placeholder="Password" value="H1a2r3t9@"><br>
        <button onclick="testLogin()">Test Login</button>
        <div id="loginStatus"></div>
    </div>

    <div class="test-section">
        <h2>Console Log</h2>
        <button onclick="clearLog()">Clear Log</button>
        <div id="log"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            updateProfile
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { 
            getFirestore, 
            doc, 
            setDoc,
            serverTimestamp 
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "***REDACTED_API_KEY***",
            authDomain: "symptom2care.firebaseapp.com",
            databaseURL: "https://symptom2care-default-rtdb.firebaseio.com",
            projectId: "symptom2care",
            storageBucket: "symptom2care.appspot.com",
            messagingSenderId: "100686432761277155946",
            appId: "1:100686432761277155946:web:8f3c4a5b6d7e8f9a0b1c2d"
        };

        let app, auth, db;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
            console.log(message);
        }

        window.clearLog = function() {
            document.getElementById('log').innerHTML = '';
        };

        window.testFirebaseInit = function() {
            const statusDiv = document.getElementById('firebaseStatus');
            try {
                log('🔥 Testing Firebase initialization...', 'warning');
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                statusDiv.innerHTML = '<p class="success">✅ Firebase initialized successfully!</p>';
                log('✅ Firebase initialized successfully', 'success');
                log(`Auth: ${auth ? 'Ready' : 'Failed'}`, auth ? 'success' : 'error');
                log(`Firestore: ${db ? 'Ready' : 'Failed'}`, db ? 'success' : 'error');
            } catch (error) {
                statusDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                log(`❌ Firebase init error: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
                log(`Error stack: ${error.stack}`, 'error');
            }
        };

        window.testDOMElements = function() {
            const statusDiv = document.getElementById('domStatus');
            const elements = {
                'testName': document.getElementById('testName'),
                'testEmail': document.getElementById('testEmail'),
                'testPassword': document.getElementById('testPassword'),
                'testConfirmPassword': document.getElementById('testConfirmPassword')
            };

            let html = '<ul>';
            let allFound = true;

            for (const [name, element] of Object.entries(elements)) {
                if (element) {
                    html += `<li class="success">✅ ${name}: Found</li>`;
                    log(`✅ DOM element ${name} found`, 'success');
                } else {
                    html += `<li class="error">❌ ${name}: Not Found</li>`;
                    log(`❌ DOM element ${name} not found`, 'error');
                    allFound = false;
                }
            }
            html += '</ul>';
            statusDiv.innerHTML = html;

            if (allFound) {
                log('✅ All DOM elements found', 'success');
            }
        };

        window.testSignup = async function() {
            const statusDiv = document.getElementById('signupStatus');
            statusDiv.innerHTML = '<p class="warning">⏳ Testing signup...</p>';
            
            try {
                if (!auth) {
                    throw new Error('Firebase not initialized. Run Test 1 first.');
                }

                const name = document.getElementById('testName').value;
                const email = document.getElementById('testEmail').value;
                const password = document.getElementById('testPassword').value;
                const confirmPassword = document.getElementById('testConfirmPassword').value;

                log(`📝 Attempting signup with email: ${email}`, 'warning');
                log(`Name: ${name}`, 'info');
                log(`Password length: ${password.length}`, 'info');

                // Validate
                if (password !== confirmPassword) {
                    throw new Error('Passwords do not match');
                }

                if (password.length < 6) {
                    throw new Error('Password must be at least 6 characters');
                }

                // Create user
                log('🔐 Creating user account...', 'warning');
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                log(`✅ User created: ${user.uid}`, 'success');

                // Update profile
                log('👤 Updating profile...', 'warning');
                await updateProfile(user, { displayName: name });
                log('✅ Profile updated', 'success');

                // Create Firestore document
                log('💾 Creating Firestore document...', 'warning');
                await setDoc(doc(db, 'users', user.uid), {
                    uid: user.uid,
                    name: name,
                    email: email,
                    createdAt: serverTimestamp(),
                    emailVerified: user.emailVerified
                });
                log('✅ Firestore document created', 'success');

                statusDiv.innerHTML = `
                    <p class="success">✅ Signup successful!</p>
                    <p>UID: ${user.uid}</p>
                    <p>Email: ${user.email}</p>
                    <p>Verified: ${user.emailVerified}</p>
                `;
                
                log('🎉 SIGNUP COMPLETED SUCCESSFULLY!', 'success');

            } catch (error) {
                statusDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                log(`❌ Signup error: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
                
                // Detailed error analysis
                if (error.code === 'auth/email-already-in-use') {
                    log('💡 This email is already registered. Try logging in instead.', 'warning');
                } else if (error.code === 'auth/weak-password') {
                    log('💡 Password is too weak. Use at least 6 characters.', 'warning');
                } else if (error.code === 'auth/invalid-email') {
                    log('💡 Email format is invalid.', 'warning');
                } else if (error.code === 'auth/network-request-failed') {
                    log('💡 Network error. Check your internet connection.', 'warning');
                }
            }
        };

        window.testLogin = async function() {
            const statusDiv = document.getElementById('loginStatus');
            statusDiv.innerHTML = '<p class="warning">⏳ Testing login...</p>';
            
            try {
                if (!auth) {
                    throw new Error('Firebase not initialized. Run Test 1 first.');
                }

                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                log(`🔐 Attempting login with email: ${email}`, 'warning');

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                statusDiv.innerHTML = `
                    <p class="success">✅ Login successful!</p>
                    <p>UID: ${user.uid}</p>
                    <p>Email: ${user.email}</p>
                    <p>Name: ${user.displayName}</p>
                    <p>Verified: ${user.emailVerified}</p>
                `;
                
                log('🎉 LOGIN COMPLETED SUCCESSFULLY!', 'success');
                log(`User: ${user.email}`, 'success');
                log(`UID: ${user.uid}`, 'success');

            } catch (error) {
                statusDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                log(`❌ Login error: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
                
                // Detailed error analysis
                if (error.code === 'auth/user-not-found') {
                    log('💡 No account found with this email. Try signing up first.', 'warning');
                } else if (error.code === 'auth/wrong-password') {
                    log('💡 Incorrect password.', 'warning');
                } else if (error.code === 'auth/invalid-email') {
                    log('💡 Email format is invalid.', 'warning');
                } else if (error.code === 'auth/network-request-failed') {
                    log('💡 Network error. Check your internet connection.', 'warning');
                }
            }
        };

        // Auto-run Firebase init test
        window.addEventListener('load', () => {
            log('🚀 Test page loaded', 'success');
            log('Click "Test Firebase Init" to start', 'warning');
        });
    </script>
</body>
</html>
