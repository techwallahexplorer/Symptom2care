<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom2Care - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .loader-container {
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo">🏥</div>
        <div class="title">Symptom2Care</div>
        <div class="subtitle">Initializing your health assistant...</div>
        <div class="spinner"></div>
    </div>

    <script>
        // Check authentication status and redirect (Simple CSV Auth)
        function checkAuth() {
            const currentUser = localStorage.getItem('currentUser');
            const guestMode = localStorage.getItem('guestMode') === 'true';
            
            if (currentUser || guestMode) {
                // User is logged in or in guest mode - go to landing page
                console.log('✅ User authenticated, redirecting to landing page');
                window.location.href = 'landing.html';
            } else {
                // No user - go to auth page
                console.log('⚠️ No authentication, redirecting to login');
                window.location.href = 'components/simple-auth.html';
            }
        }

        // Check immediately
        checkAuth();

        // Fallback redirect after 2 seconds
        setTimeout(checkAuth, 2000);
    </script>
</body>
</html>
